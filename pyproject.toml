[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent"
version = "0.1.0"
description = "Auditable, evaluation-gated self-improvement loop for agents"
requires-python = ">=3.10"

[project.scripts]
evoagent = "evoagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"