name: audit
on: [push, pull_request, workflow_dispatch]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: pip install -e . cryptography numpy faiss-cpu sentence-transformers transformers
      - name: Reject private keys in trust store
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          from evoagent.key_governance import audit_key_directory
          result = audit_key_directory(Path('.evo/trusted-keys'))
          print(result)
          raise SystemExit(0 if result['valid'] else 1)
          PY
      - name: Compile source tree
        run: python -m compileall -q src
      - name: Run self-evolution test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Verify signed active bundle and current file integrity
        # `.evo/` holds local evolution state, private evidence and the signing
        # key material, so it is gitignored by design (.gitignore:2) and is never
        # present on a fresh checkout. The gate below is meaningless without it:
        # `promote` exits 2 with `active_file_missing` on every clean clone.
        # Run it only when the operator has deliberately published evidence.
        if: hashFiles('.evo/workflow-bundles.json') != ''
        env:
          PYTHONPATH: src
        run: python -m evoagent.bundle_signer promote --bundles .evo/workflow-bundles.json --signatures .evo/workflow-signatures.json --trusted .evo/trusted-keys --active .evo/active-workflow-bundle.txt
      - name: Report that the bundle gate was skipped
        if: hashFiles('.evo/workflow-bundles.json') == ''
        run: >-
          echo "::notice title=Bundle gate skipped::.evo/ is gitignored (private evidence + key material), so the signed-bundle gate has nothing to verify on a clean checkout. Run it locally after an evidence-producing round: python -m evoagent.bundle_signer promote --bundles .evo/workflow-bundles.json --signatures .evo/workflow-signatures.json --trusted .evo/trusted-keys --active .evo/active-workflow-bundle.txt"
