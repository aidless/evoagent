name: secret-scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    # .gitleaks.toml is present in this repo, but nothing in CI actually ran it.
    # A pre-commit hook is opt-in, missing from a fresh clone, bypassable with
    # `git commit --no-verify`, and only inspects staged content -- never
    # history. So a committed key would have left every other check green.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a key leaked in an old commit is still a live key.
          fetch-depth: 0
      - name: gitleaks (full history, CLI)
        # The gitleaks-action v2 turned every Dependabot pull request red with
        # "GITHUB_TOKEN is now required to scan pull requests" -- a failure
        # caused by the action's requirements, not by the repository. The CLI
        # needs no token, scans the same checked-out history, and has one fewer
        # moving part.
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
